---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Scheduled Scan

# PR filesystem/image scanning lives in ci.yaml and participates in its required
# Build Success fan-in. This workflow is the report-only weekly drift monitor;
# Renovate remains the remediation path for base digest and lockfile bumps.
#
# Personal-account note: SARIF upload requires GitHub code scanning, which is
# free on public repos but unavailable on private personal repos (GHAS is
# org/enterprise-only). If this repo goes private, swap the upload steps for
# `format: table` + `exit-code: "0"` console output.

on:
  schedule:
    - cron: 0 5 * * 1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy (deps, secrets, IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  image:
    name: Trivy Image Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy against the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:main
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
