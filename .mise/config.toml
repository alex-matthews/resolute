[tools]
actionlint = "1.7.12"
hadolint = "2.15.1"
helm = "4.2.3"
kubeconform = "0.8.0"
lefthook = "2.1.10"
node = "24.19.0"
oxfmt = "0.66.0"
python = "3.14.7"
shellcheck = "0.11.0"
uv = "0.12.3"
zizmor = "1.29.0"
yq = "4.53.3"

[hooks]
postinstall = "lefthook install"

[tasks.sync]
description = "Install locked dependencies (incl. dev group)"
run = "uv sync --locked"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Run ruff over source and tests"
run = "uv run ruff check src tests"

[tasks.lint-fix]
description = "Run ruff with --fix"
run = "uv run ruff check --fix src tests"

[tasks.python-format]
description = "Format Python source and tests"
run = "uv run ruff format src tests"

[tasks.python-format-check]
description = "Verify Python formatting without changing files"
run = "uv run ruff format --check src tests"

[tasks.markdown-format]
description = "Format authored Markdown files"
run = "oxfmt --no-error-on-unmatched-pattern '**/*.md' '**/*.markdown' '**/*.mdx'"

[tasks.markdown-format-check]
description = "Verify authored Markdown formatting without changing files"
run = "oxfmt --check --no-error-on-unmatched-pattern '**/*.md' '**/*.markdown' '**/*.mdx'"

[tasks.golden]
description = "Run the canned-verdict pipeline fixtures (rails/planner regressions, not a taste oracle)"
run = "RESOLUTE_DB_PATH=$(mktemp -d)/golden.db uv run resolute fixtures-test"

[tasks.dockerfile-lint]
description = "Lint the Dockerfile"
run = "hadolint Dockerfile"

[tasks.shell-lint]
description = "Run ShellCheck over repo shell scripts"
run = "shellcheck scripts/*.sh"

[tasks.workflow-lint]
description = "Lint and security-check GitHub workflows"
run = """
actionlint
zizmor .github/workflows
"""

[tasks.helm-render]
description = "Render the app-template HelmRelease values with Helm"
run = """
VERSION=$(yq '.spec.ref.tag' deploy/kubernetes/app/ocirepository.yaml)
yq '.spec.values' deploy/kubernetes/app/helmrelease.yaml > /tmp/resolute-values.yaml
helm template resolute oci://ghcr.io/bjw-s-labs/helm/app-template --version "${VERSION}" -f /tmp/resolute-values.yaml
"""

[tasks.kubeconform]
description = "Validate rendered manifests and Flux/CRD resources with kubeconform"
run = "bash scripts/kubeconform.sh"

[tasks.k8s-smoke]
description = "Run the built image under Kubernetes-like constraints (uid 1032:100, read-only rootfs, only /data writable, no HOME)"
run = "bash scripts/k8s-smoke.sh"

[tasks.build]
description = "Build the container image locally"
run = "docker build -t resolute:local ."

[tasks.ci]
description = "Core CI checks, locally (excludes the container build: run `mise run build` separately, it needs a Docker daemon)"
depends = [
  "lint",
  "python-format-check",
  "markdown-format-check",
  "test",
  "golden",
  "dockerfile-lint",
  "shell-lint",
  "workflow-lint",
  "kubeconform",
]

[tasks.eval]
description = "Model-eval suite against the CONFIGURED LIVE model (spends provider money; never part of ci). See docs/testing.md."
run = "uv run resolute eval"
